[package]
name = "yuhina"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "A Material 3 Expressive Minecraft launcher built with GPUI"
publish = false

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "b881cadb7cf7c43b579f60bdac496460ab2f6276" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }

base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
flate2 = "1"
hex = "0.4"
hickory-resolver = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "3"
md-5 = "0.10"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt", "net", "time"] }
ureq = { version = "2", features = ["json", "tls"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

[build-dependencies]
winres = "0.1"

[patch.crates-io]
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-pre = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-pre-apple = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-pre-web = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-fast = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-fast-apple = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-fast-web = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "26c0cb1713311280919113e14b552034e492d573" }
